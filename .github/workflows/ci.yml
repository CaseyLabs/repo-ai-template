name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ai-setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # The commit-message check needs the pushed or PR range.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: AI setup self-check
        # Template mode allows unfilled placeholders; init-project.py removes the flag.
        run: python3 tools/ai-check.py --template
      - name: Workflow helper tests
        run: python3 -m unittest discover -s tools/tests -p 'test_*.py'
      - name: Skill path checks
        run: python3 .agents/skills/project-next-milestone/tests/paths.py
      - name: Markdown links
        run: python3 tools/check-doc-links.py --all
      - name: Commit messages
        # Reruns the commit-msg hook, which a local commit can skip (`git commit -n`).
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # A new branch or a rewritten base has no usable range, so check all of history.
          range="$HEAD_SHA"
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then range="$BASE..$HEAD_SHA"; fi
          tools/check-commit-messages.sh "$range"
